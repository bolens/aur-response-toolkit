name: Pages

on:
  release:
    types: [published]
  push:
    branches:
      - main
    paths:
      - "site/**"
      - "CHANGELOG.md"
      - "scripts/render-changelog.py"
      - "scripts/ci/build-site-release-metadata.py"
      - "scripts/ci/build-site-fonts.sh"
      - "scripts/ci/check-site-accessibility.py"
      - "scripts/ci/check-site-links.py"
      - "scripts/ci/check-site-visual.sh"
      - "tests/site-visual/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: read
      pages: write
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Verify generated changelog
        run: python3 scripts/render-changelog.py --name "AUR Response Toolkit" --base-url https://bolens.github.io/aur-response-toolkit/ --accent "#f4bf75" --social-image og.png --favicon favicon.png --output site/changelog/index.html
      - name: Build current release metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          version="${tag#v}"
          version_file="$RUNNER_TEMP/VERSION"
          printf '%s\n' "$version" > "$version_file"
          site_output="$RUNNER_TEMP/site"
          cp -R site "$site_output"
          mkdir -p "$RUNNER_TEMP/release"
          gh release download "$tag" \
            --pattern "aur-response-toolkit-$version-linux-x86_64.tar.gz.sha256" \
            --pattern "aur-response-toolkit-$version-source.tar.gz.sha256" \
            --dir "$RUNNER_TEMP/release"
          python3 scripts/ci/build-site-release-metadata.py \
            "$version_file" \
            "$RUNNER_TEMP/release/aur-response-toolkit-$version-linux-x86_64.tar.gz.sha256" \
            "$RUNNER_TEMP/release/aur-response-toolkit-$version-source.tar.gz.sha256" \
            "$site_output/release.json" \
            "$site_output/index.html"
      - name: Validate site files
        run: |
          test -s "$RUNNER_TEMP/site/index.html"
          test -s "$RUNNER_TEMP/site/styles.css"
          test -s "$RUNNER_TEMP/site/app.js"
          test -s "$RUNNER_TEMP/site/release.json"
      - name: Check accessibility
        env:
          SITE_DIR: ${{ runner.temp }}/site
        run: python3 scripts/ci/check-site-accessibility.py
      - name: Check links and metadata
        env:
          CHECK_EXTERNAL_LINKS: "1"
          SITE_DIR: ${{ runner.temp }}/site
        run: python3 scripts/ci/check-site-links.py
      - name: Install screenshot comparison tool
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
      - name: Check responsive screenshots
        env:
          SITE_DIR: ${{ runner.temp }}/site
        run: bash scripts/ci/check-site-visual.sh
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: ${{ runner.temp }}/site

  deploy:
    permissions:
      id-token: write
      pages: write
    name: deploy
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
