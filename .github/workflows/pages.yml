name: Pages

on:
  push:
    branches:
      - main
    paths:
      - "site/**"
      - "scripts/ci/build-site-release-metadata.py"
      - "scripts/ci/check-site-visual.sh"
      - "tests/site-visual/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Build current release metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="$(cat VERSION)"
          mkdir -p "$RUNNER_TEMP/release"
          gh release download "v$version" \
            --pattern "aur-response-toolkit-$version-linux-x86_64.tar.gz.sha256" \
            --pattern "aur-response-toolkit-$version-source.tar.gz.sha256" \
            --dir "$RUNNER_TEMP/release"
          python3 scripts/ci/build-site-release-metadata.py \
            VERSION \
            "$RUNNER_TEMP/release/aur-response-toolkit-$version-linux-x86_64.tar.gz.sha256" \
            "$RUNNER_TEMP/release/aur-response-toolkit-$version-source.tar.gz.sha256" \
            site/release.json
      - name: Validate site files
        run: |
          test -s site/index.html
          test -s site/styles.css
          test -s site/app.js
          test -s site/release.json
      - name: Install screenshot comparison tool
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
      - name: Check responsive screenshots
        run: bash scripts/ci/check-site-visual.sh
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v4
        with:
          path: site

  deploy:
    name: deploy
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
