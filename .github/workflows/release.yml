name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

# One release job per immutable tag.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  await-ci:
    name: Await CI
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Require successful CI on the tagged commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for _ in $(seq 1 90); do
            conclusion="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml \
              --commit "$GITHUB_SHA" --limit 1 \
              --json status,conclusion --jq '.[0] | if .status == "completed" then .conclusion else .status end // "missing"')"
            case "$conclusion" in
              success) exit 0 ;;
              failure|cancelled|timed_out|action_required|startup_failure)
                echo "CI finished with: $conclusion" >&2
                exit 1
                ;;
            esac
            sleep 30
          done
          echo "Timed out waiting for CI on $GITHUB_SHA" >&2
          exit 1

  release:
    name: Build and publish
    needs: await-ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: write
      contents: write
    outputs:
      source_sha256: ${{ steps.source.outputs.sha256 }}
      version: ${{ steps.source.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Build native release
        run: cargo build --release --locked

      - name: Package native release
        id: source
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          test "$(cat VERSION)" = "$version"
          bundle="aur-response-toolkit-${version}-linux-x86_64"
          mkdir "$bundle"
          install -Dm755 target/release/aur-response "$bundle/aur-response"
          install -Dm644 README.md config.toml.example LICENSE THIRD_PARTY_LICENSES.txt THIRD_PARTY_NOTICES.md "$bundle/"
          cp -R data "$bundle/data"
          tar -czf "$bundle.tar.gz" "$bundle"
          sha256sum "$bundle.tar.gz" > "$bundle.tar.gz.sha256"
          curl -fsSL \
            "https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/${GITHUB_REF_NAME}.tar.gz" \
            -o "aur-response-toolkit-${version}-source.tar.gz"
          sha256sum "aur-response-toolkit-${version}-source.tar.gz" \
            > "aur-response-toolkit-${version}-source.tar.gz.sha256"
          source_sha256="$(sha256sum "aur-response-toolkit-${version}-source.tar.gz" | cut -d' ' -f1)"
          [[ "$source_sha256" =~ ^[0-9a-f]{64}$ ]]
          {
            echo "version=$version"
            echo "sha256=$source_sha256"
          } >> "$GITHUB_OUTPUT"

      - name: Extract changelog for tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="$VERSION" '
            $0 ~ "^## " ver "$" { found=1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if ! test -s release-notes.md; then
            echo "No CHANGELOG section for version $VERSION" >&2
            exit 1
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          body_path: release-notes.md
          generate_release_notes: false
          files: |
            aur-response-toolkit-*-linux-x86_64.tar.gz
            aur-response-toolkit-*-linux-x86_64.tar.gz.sha256
            aur-response-toolkit-*-source.tar.gz.sha256

      - name: Refresh user guide release data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main

  update-packaging:
    name: Open packaging update PR
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
    outputs:
      branch: ${{ steps.pr.outputs.pull-request-branch }}
      number: ${{ steps.pr.outputs.pull-request-number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: main
      - name: Update Arch source hash
        run: |
          python3 scripts/ci/update-release-packaging.py \
            "${{ needs.release.outputs.version }}" \
            "${{ needs.release.outputs.source_sha256 }}"
          bash scripts/ci/test-update-release-packaging.sh
      - name: Create packaging PR
        id: pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(arch): pin v${{ needs.release.outputs.version }} source checksum"
          branch: "chore/arch-v${{ needs.release.outputs.version }}-checksum"
          delete-branch: true
          title: "chore(arch): pin v${{ needs.release.outputs.version }} source checksum"
          body: |
            Updates the Arch manifests with the SHA-256 digest calculated from
            the tagged GitHub source archive.

  finalize-packaging:
    name: Verify and merge packaging PR
    needs: update-packaging
    if: needs.update-packaging.outputs.number != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: write
      contents: write
      pull-requests: write
    steps:
      - name: Dispatch CI for packaging branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ needs.update-packaging.outputs.branch }}
        run: gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$BRANCH"
      - name: Wait for CI and squash-merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ needs.update-packaging.outputs.branch }}
          PR: ${{ needs.update-packaging.outputs.number }}
        run: |
          set -euo pipefail
          run_id=""
          for _ in $(seq 1 30); do
            run_id="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml \
              --branch "$BRANCH" --event workflow_dispatch --limit 1 \
              --json databaseId --jq '.[0].databaseId // empty')"
            [[ -n "$run_id" ]] && break
            sleep 10
          done
          [[ -n "$run_id" ]] || { echo "CI run was not scheduled" >&2; exit 1; }
          gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --exit-status
          gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --squash --delete-branch
