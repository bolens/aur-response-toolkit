name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

jobs:
  packaging:
    name: packaging
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Check release packaging automation
        run: |
          bash scripts/ci/test-update-release-packaging.sh
          bash scripts/ci/test-build-site-release-metadata.sh
          python3 -m py_compile \
            scripts/ci/build-site-release-metadata.py \
            scripts/ci/check-site-accessibility.py \
            scripts/ci/check-site-links.py

  rust:
    name: rust
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Install compressed-log tools
        run: |
          sudo apt-get update
          sudo apt-get install -y xz-utils bzip2 zstd iproute2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  arch:
    name: arch
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container:
      image: archlinux:latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install native dependencies
        run: |
          pacman -Sy --noconfirm archlinux-keyring
          pacman-key --init
          pacman-key --populate archlinux
          pacman -Sy --noconfirm rust cargo curl git iproute2 procps-ng zstd
      - run: cargo test --locked
