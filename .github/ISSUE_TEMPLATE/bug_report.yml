name: Bug report
description: Report a crash, wrong exit code, or other toolkit failure
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    value: |
      Do **not** paste live secrets, tokens, or full shell histories. Redact paths if needed.

  - type: input
    id: version
    attributes:
      label: Toolkit version
      description: Output of `aur-response --version` or contents of `VERSION`
      placeholder: "1.9.0"
    validations:
      required: true

  - type: input
    id: distro
    attributes:
      label: Distribution
      placeholder: "Arch Linux, CachyOS, or Manjaro"
    validations:
      required: true

  - type: input
    id: rust_version
    attributes:
      label: Installation source
      placeholder: "cargo build, Arch package, or release binary"
    validations:
      required: true

  - type: textarea
    id: command
    attributes:
      label: Command and flags
      placeholder: "aur-response --local --report"
    validations:
      required: true

  - type: input
    id: exit_code
    attributes:
      label: Exit code
      placeholder: "0, 1, 2, 3, or 4"
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant output (sanitized)
      description: Sanitized terminal output or an excerpt from `reports/latest-summary.json`
    validations:
      required: false
